type: custom:simple-swipe-card
enable_auto_swipe: true
auto_swipe_interval: 10000
loop_mode: infinite
cards:

  # ── Slide 1: Points ──────────────────────────────────────────────────────
  - type: custom:html-template-card
    ignore_line_breaks: true
    content: |
      <style>
        .lg-container { font-family: Arial, sans-serif; max-width: 100%; margin: 0 auto; }
        .lg-title { font-size: 32px; font-weight: bold; margin-top: 12px; margin-bottom: 12px; color: var(--primary-text-color); text-align: center; }
        .lg-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
        .lg-card { min-width: 0; background: var(--card-background-color); border-radius: 10px;
                   box-shadow: 0 2px 5px rgba(0,0,0,.2); overflow: hidden; display: flex;
                   flex-direction: column; padding-bottom: 10px; }
        .lg-team-bar { width: 100%; height: 6px; }
        .lg-header { background: #222; color: #fff; padding: 6px 8px; display: flex;
                     justify-content: space-between; align-items: center; font-size: 16px; }
        .lg-number { font-weight: bold; font-size: 20px; }
        .lg-img-wrap { width: 100%; aspect-ratio: 1; background: var(--secondary-background-color); overflow: hidden; }
        .lg-img { width: 100%; height: 100%; object-fit: cover; }
        .lg-name { font-weight: bold; text-align: center; padding: 6px 4px; font-size: 22px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--primary-text-color); }
        .lg-pos { text-align: center; color: var(--secondary-text-color); font-size: 12px; margin-top: -4px; }
        .lg-stat { text-align: center; font-size: 28px; font-weight: bold; margin: 8px 0; color: var(--primary-text-color); }
        .lg-gp { text-align: center; color: var(--secondary-text-color); font-size: 15px; }
        .lg-record { text-align: center; color: var(--secondary-text-color); font-size: 14px; margin-top: 2px; }
        .lg-updated { text-align: right; font-size: 11px; color: var(--secondary-text-color); margin-top: 10px; font-style: italic; }
        .karpat   { background: #009345; } .tappara  { background: #0066B1; }
        .hifk     { background: #E31E24; } .lukko    { background: #0072CE; }
        .pelicans { background: #009FDF; } .ilves    { background: #FFDD00; }
        .hpk      { background: #FF6600; } .jyp      { background: #000000; }
        .kalpa    { background: #FFDD00; } .sport    { background: #E31937; }
        .tps      { background: #000000; } .kookoo   { background: #F7AF1D; }
        .saipa    { background: #FFDD00; } .assat    { background: #e4021b; }
        .jukurit  { background: #00B0CA; } .kespoo   { background: #003580; }
        .default-team { background: #333; }
        @media (max-width: 480px) { .lg-stat { font-size: 18px; } }
      </style>
      {% set sensor = 'sensor.liiga_points_leaders' %}
      {% set leaders = state_attr(sensor, 'leaders') | default([]) %}
      {% set team_map = {
        'Kärpät':'karpat','Ässät':'assat','K-Espoo':'kespoo','Jukurit':'jukurit',
        'Tappara':'tappara','HIFK':'hifk','Lukko':'lukko','Pelicans':'pelicans',
        'Ilves':'ilves','HPK':'hpk','JYP':'jyp','KalPa':'kalpa','Sport':'sport',
        'TPS':'tps','KooKoo':'kookoo','SaiPa':'saipa'
      } %}
      <div class="lg-container">
        <div class="lg-title">Points Leaders</div>
        <div class="lg-cards">
          {% for p in leaders %}
            {% set tc = team_map.get(p.team, 'default-team') %}
            <div class="lg-card">
              <div class="lg-team-bar {{ tc }}"></div>
              <div class="lg-header">
                <span class="lg-number">#{{ p.number if p.number else '?' }}</span>
                <span>{{ p.team }}</span>
              </div>
              <div class="lg-img-wrap">
                {% if p.image_url %}
                  <img class="lg-img" src="{{ p.image_url }}" alt="{{ p.name }}"
                       onerror="this.style.display='none';this.parentNode.style.background='#333'">
                {% endif %}
              </div>
              <div class="lg-name">{{ p.name }}</div>
              <div class="lg-pos">{{ p.position }}</div>
              <div class="lg-stat">{{ p.value }}</div>
              <div class="lg-gp">GP: {{ p.games }}</div>
              <div class="lg-record">{{ p.gap }}</div>
            </div>
          {% endfor %}
        </div>
        <div class="lg-updated">Updated: {{ (state_attr(sensor, 'last_updated') | as_datetime | as_local | strftime('%d %b %H:%M')) if state_attr(sensor, 'last_updated') else '—' }}</div>
      </div>

